# 构建门禁（docs/ENGINEERING_RULES.md §11）：四个任务都必须通过，Lint 0 错误。
# 缺少的 SDK 平台由 AGP 按 compileSdk 自动下载（GitHub 托管机已接受 SDK 许可）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      # 与 jitpack.yml 保持同一 JDK：AGP 9.4 需要 JDK 17。
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest :sample:testReleaseUnitTest lintDebug --console=plain --no-daemon

      - name: Verify optional runtimes through Sample R8
        run: ./gradlew :sample:minifyReleaseWithR8 -Plumen.verifySampleR8=true --console=plain --no-daemon

      - name: Verify third-party notices in distributions
        run: |
          ./gradlew bundleReleaseAar sourceReleaseJar --console=plain --no-daemon
          for module in lumen-engine lumen-effects lumen-assets lumen-assets-lottie lumen-assets-pag lumen-assets-rive; do
            python3 tools/check_third_party_notices.py --aar "$module/build/outputs/aar/$module-release.aar" --sources "$module/build/intermediates/source_jar/release/release-sources.jar" || exit 1
          done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
