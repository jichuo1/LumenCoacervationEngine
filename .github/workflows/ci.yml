# 构建门禁（docs/ENGINEERING_RULES.md §11）：四个任务都必须通过，Lint 0 错误。
# 缺少的 SDK 平台由 AGP 按 compileSdk 自动下载（GitHub 托管机已接受 SDK 许可）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 与 jitpack.yml 保持同一 JDK：AGP 9.4 需要 JDK 17。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest :sample:testReleaseUnitTest lintDebug --console=plain --no-daemon

      - name: Verify third-party notices in distributions
        run: |
          ./gradlew :lumen-engine:bundleReleaseAar :lumen-engine:sourceReleaseJar --console=plain --no-daemon
          python3 tools/check_third_party_notices.py --aar lumen-engine/build/outputs/aar/lumen-engine-release.aar --sources lumen-engine/build/intermediates/source_jar/release/release-sources.jar

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
