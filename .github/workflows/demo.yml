# 演示包：构建 sample 的 release 包 → 在四个系统版本的模拟器上跑冒烟测试 → 全部通过才上传到 Release。
#
# - PR 与 push main：只构建并测试，不发布。
# - 发布新 Release：自动把演示包附到该 Release。
# - 手动运行（workflow_dispatch）：从指定 tag 构建并附到该 Release（默认 1.1.1），同名文件覆盖。
name: Demo APK

on:
  pull_request:
    paths:
      - 'sample/**'
      - 'lumen-*/src/main/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/demo.yml'
      - '.github/scripts/run-smoke.sh'
      - '.github/scripts/prepare-emulator.sh'
      - '.github/scripts/verify-smoke-results.py'
      - 'tools/test_prepare_emulator.py'
      - 'tools/test_verify_smoke_results.py'
  push:
    branches: [main]
    paths:
      - 'sample/**'
      - 'lumen-*/src/main/**'
      - '.github/workflows/demo.yml'
      - '.github/scripts/run-smoke.sh'
      - '.github/scripts/prepare-emulator.sh'
      - '.github/scripts/verify-smoke-results.py'
      - 'tools/test_prepare_emulator.py'
      - 'tools/test_verify_smoke_results.py'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要附加演示包的 Release tag'
        required: true
        default: '1.1.1'

concurrency:
  group: demo-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Test emulator installation retry
        run: python3 -m unittest discover -s tools -p 'test_*smoke*.py' -v && python3 -m unittest discover -s tools -p test_prepare_emulator.py -v

      - name: Build release APK and test APK
        run: ./gradlew :sample:assembleRelease :sample:assembleReleaseAndroidTest --console=plain --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: demo-apks
          path: |
            sample/build/outputs/apk/release/*.apk
            sample/build/outputs/apk/androidTest/release/*.apk
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 27 = minSdk（只有柔光）；31 = 高级材质 BLUR 后端；33 / 34 = 高级材质 REFRACTION 后端。
        # 33保留ATD。34用标准镜像做真实像素检查；ATD官方不支持硬件截图，启用输出后曾整机退出。
        # 34固定36.5.11模拟器，使用Skia Vulkan与Mesa lavapipe执行完整渲染检查。
        include:
          - api-level: 27
            target: default
          - api-level: 31
            target: google_apis
          - api-level: 33
            target: aosp_atd
          - api-level: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Action 会无条件安装最新 emulator；预先安装成功后该步骤只检查已安装包。
      # SDK 下载/解压最多重试三次，应用测试的失败仍直接阻止发布。
      - name: Install emulator runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0

      - name: Prepare Android Emulator with bounded retry
        run: bash .github/scripts/prepare-emulator.sh

      - name: Smoke test on emulator (API ${{ matrix.api-level }} ${{ matrix.target }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # API34 uses Skia Vulkan backed by Mesa lavapipe; retain the actual pixel assertions.
          HWUI_RENDERER: ${{ matrix.api-level == 34 && 'skiavk' || '' }}
          SMOKE_API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          # 37.2.12 exited during API34 rendering; use the verified 36.5.11 binary.
          emulator-build: ${{ matrix.api-level == 34 && '15261927' || '' }}
          target: ${{ matrix.target }}
          arch: x86_64
          # 长按弹性在系统动画关闭时不启用（它按 ValueAnimator.areAnimatorsEnabled 门控），测试需要动画开着。
          disable-animations: false
          # 默认 RAM 偏小：高级材质的实时取样三缓冲加上两套材质来回重建，给足内存免得模拟器中途被杀。
          ram-size: 4096M
          heap-size: 576M
          disk-size: 4096M
          emulator-options: -no-window -gpu ${{ matrix.api-level == 34 && 'lavapipe' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none -show-kernel
          script: |
            bash .github/scripts/run-smoke.sh || { adb logcat -d -b crash; exit 1; }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-api${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            sample/build/reports/androidTests/
            sample/build/outputs/androidTest-results/
            logcat.txt
            host-usage.txt
          retention-days: 14

  publish:
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: demo-apks
          path: apks

      - name: Attach demo APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          apk=$(find apks -path '*androidTest*' -prune -o -name '*.apk' -print | head -n 1)
          test -n "$apk"
          cp "$apk" "lumen-demo-${TAG}.apk"
          gh release upload "$TAG" "lumen-demo-${TAG}.apk" --clobber
