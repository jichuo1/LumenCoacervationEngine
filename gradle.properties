# Windows 的短 tmpdir 与堆大小由 gradlew.bat 注入（LUMEN_GRADLE_*），避免把本机路径写进共享配置。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 引擎版本（语义化版本）。公开 API 或适配标准有不兼容变化时升主版本，见 docs/VERSIONING.md。
lumen.version=1.0.0
lumen.compileSdk=37
lumen.minSdk=27
lumen.targetSdk=37
