# Windows 的短 tmpdir 与堆大小由 gradlew.bat 注入（LUMEN_GRADLE_*），避免把本机路径写进共享配置。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 引擎版本（语义化版本）。公开 API 或适配标准有不兼容变化时升主版本，见 docs/VERSIONING.md。
# Maven 坐标 group。默认引擎坐标；JitPack 构建时用 -Plumen.group=com.github.<user>.<repo> 覆盖为其要求的坐标。
lumen.group=com.lumen.coacervation.engine
lumen.version=1.2.1
lumen.compileSdk=37
lumen.minSdk=27
lumen.targetSdk=37
